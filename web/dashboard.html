<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenDocket — Analytics Dashboard</title>
  <style>
    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    body { background:#FFFFFF; color:#0D1117; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size:15px; line-height:1.6; }
    a { color:#0052CC; text-decoration:none; }
    a:hover { text-decoration:underline; }
    .header { padding:16px 24px; border-bottom:1px solid #E1E4E8; display:flex; justify-content:space-between; align-items:center; }
    .header h1 { font-size:18px; font-weight:700; }
    .header nav a { margin-left:20px; font-size:14px; color:#57606A; }
    .container { max-width:1080px; margin:0 auto; padding:40px 24px; }
    h2 { font-size:24px; font-weight:600; margin-bottom:24px; }
    .stats-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; margin-bottom:40px; }
    .stat-card { background:#F8F9FA; border:1px solid #E1E4E8; border-radius:6px; padding:20px; }
    .stat-card .num { font-size:32px; font-weight:700; color:#0052CC; }
    .stat-card .label { font-size:13px; color:#57606A; margin-top:4px; }
    .recent-table { width:100%; border-collapse:collapse; }
    .recent-table th { text-align:left; padding:8px 12px; font-size:12px; font-weight:600; color:#57606A; text-transform:uppercase; letter-spacing:0.5px; border-bottom:2px solid #E1E4E8; }
    .recent-table td { padding:10px 12px; font-size:14px; border-bottom:1px solid #E1E4E8; }
    .recent-table tr:hover td { background:#F8F9FA; }
    .status-badge { padding:2px 8px; border-radius:3px; font-size:12px; font-weight:600; }
    .status-complete { background:#F0FFF4; color:#1A7F37; }
    .status-running { background:#F0F5FF; color:#0052CC; }
    .status-failed { background:#FFF8F8; color:#CF222E; }
    .status-queued { background:#FFFBE0; color:#9A6700; }
    .judge-section { margin-top:40px; }
    .judge-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:16px; }
    .judge-card { background:#F8F9FA; border:1px solid #E1E4E8; border-radius:6px; padding:16px; text-align:center; }
    .judge-card .num { font-size:24px; font-weight:700; }
    .judge-card .label { font-size:12px; color:#57606A; }
    .judge-confirmed .num { color:#1A7F37; }
    .judge-context .num { color:#9A6700; }
    .judge-fp .num { color:#0052CC; }
    .judge-additional .num { color:#CF222E; }
    @media (max-width:768px) { .stats-grid, .judge-grid { grid-template-columns:repeat(2,1fr); } }
    @media print { body { font-size:12px; } }
  </style>
</head>
<body>
  <div class="header">
    <h1>OpenDocket Dashboard</h1>
    <nav>
      <a href="index.html">Home</a>
      <a href="methodology.html">Methodology</a>
      <a href="https://github.com/anthropics/opendocket">GitHub</a>
    </nav>
  </div>
  <div class="container">
    <h2>Scan Analytics</h2>
    <div class="stats-grid">
      <div class="stat-card"><div class="num" id="d-scans">--</div><div class="label">Total Scans</div></div>
      <div class="stat-card"><div class="num" id="d-lines">--</div><div class="label">Lines Scanned</div></div>
      <div class="stat-card"><div class="num" id="d-findings">--</div><div class="label">Findings</div></div>
      <div class="stat-card"><div class="num" id="d-high">--</div><div class="label">High Risk</div></div>
    </div>

    <div class="judge-section">
      <h2>Independent Review (Gemini)</h2>
      <div class="judge-grid">
        <div class="judge-card judge-confirmed"><div class="num" id="d-confirmed">--</div><div class="label">Confirmed</div></div>
        <div class="judge-card judge-context"><div class="num" id="d-context">--</div><div class="label">Context Dependent</div></div>
        <div class="judge-card judge-fp"><div class="num" id="d-fp">--</div><div class="label">Possible False Positive</div></div>
        <div class="judge-card judge-additional"><div class="num" id="d-additional">--</div><div class="label">Additional Risk</div></div>
      </div>
    </div>

    <h2 style="margin-top:40px">Recent Scans</h2>
    <table class="recent-table" id="recent-table">
      <thead><tr><th>Repository</th><th>Status</th><th>Score</th><th>High</th><th>Med</th><th>Duration</th><th>Time</th></tr></thead>
      <tbody id="recent-body"><tr><td colspan="7" style="color:#57606A;text-align:center;padding:20px">Loading...</td></tr></tbody>
    </table>
  </div>
  <script>
    fetch('/api/stats').then(r=>r.json()).then(d=>{
      document.getElementById('d-scans').textContent=(d.total_scans||0).toLocaleString();
      document.getElementById('d-lines').textContent=((d.total_lines_scanned||0)/1e6).toFixed(1)+'M';
      document.getElementById('d-findings').textContent=(d.total_findings||0).toLocaleString();
      document.getElementById('d-high').textContent=(d.high_risk_found||0).toLocaleString();
      document.getElementById('d-confirmed').textContent=(d.judge_confirmed||0).toLocaleString();
      document.getElementById('d-context').textContent='--';
      document.getElementById('d-fp').textContent=(d.judge_overrides||0).toLocaleString();
      document.getElementById('d-additional').textContent='--';
    }).catch(()=>{});

    fetch('/api/recent').then(r=>r.json()).then(rows=>{
      const tbody=document.getElementById('recent-body');
      if(!rows.length){tbody.innerHTML='<tr><td colspan="7" style="color:#57606A;text-align:center">No scans yet</td></tr>';return;}
      tbody.innerHTML=rows.map(r=>{
        const cls={'complete':'status-complete','running':'status-running','failed':'status-failed','queued':'status-queued'}[r.status]||'';
        return `<tr><td>${r.repo_name||'—'}</td><td><span class="status-badge ${cls}">${r.status}</span></td><td>${r.opendocket_score||'—'}</td><td style="color:#CF222E">${r.finding_high||0}</td><td style="color:#9A6700">${r.finding_medium||0}</td><td>${r.scan_duration_seconds?r.scan_duration_seconds.toFixed(0)+'s':'—'}</td><td style="color:#57606A;font-size:12px">${r.timestamp?r.timestamp.substring(0,16):'—'}</td></tr>`;
      }).join('');
    }).catch(()=>{document.getElementById('recent-body').innerHTML='<tr><td colspan="7" style="color:#57606A;text-align:center">Could not load data. Is the API running?</td></tr>';});
  </script>
</body>
</html>
